<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Status alamat Adip Cinema: alamat mana yang bisa dibuka sekarang.">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Status Adip Cinema</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  .summary { font-size: 15px; padding: 12px 0; border-top: 1px solid #27272a; border-bottom: 1px solid #27272a; margin-bottom: 8px; }
  .summary .num { font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px solid #18181b; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
  .dot-green { background: #22c55e; }
  .dot-red { background: #ef4444; }
  .dot-gray { background: #52525b; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 15px; }
  .state { font-size: 13px; color: #a1a1aa; }
  .state.bad { color: #fca5a5; }
  .ms { font-size: 13px; color: #71717a; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .updated { color: #71717a; font-size: 13px; margin-top: 20px; }
  .note { color: #71717a; font-size: 13px; line-height: 1.5; margin-top: 8px; }
  a { color: #fff; }
  .error { color: #fca5a5; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Status Adip Cinema</h1>
  <p class="sub">Alamat mana yang bisa dibuka sekarang. Dicek otomatis tiap 15 menit.</p>
  <p class="summary" id="ringkasan">Memeriksa status&hellip;</p>
  <ul id="daftar"></ul>
  <p class="updated" id="diperbarui"></p>
  <p class="note">Data mentah: <a href="status.json">status.json</a>. Halaman ini hanya membaca status, tidak mengecek sendiri.</p>
</main>
<script>
(function () {
  "use strict";
  var ringkasan = document.getElementById("ringkasan");
  var daftar = document.getElementById("daftar");
  var diperbarui = document.getElementById("diperbarui");

  function label(entry) {
    if (!entry.ok && entry.hidden) return { text: "Sedang bermasalah", bad: true };
    if (!entry.ok && entry.flagged) return { text: "Sedang bermasalah", bad: true };
    if (!entry.ok) return { text: "Tidak menjawab", bad: true };
    if (entry.flagged) return { text: "Bisa dibuka (sempat bermasalah)", bad: false };
    return { text: "Bisa dibuka", bad: false };
  }

  fetch("status.json", { cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }).then(function (data) {
    if (!data || !data.mirrors) throw new Error("format status tidak dikenal");
    var ids = Object.keys(data.mirrors);
    var hidup = 0;
    ids.forEach(function (id) { if (data.mirrors[id].ok) hidup++; });
    ringkasan.innerHTML = "<span class=\"num\">" + hidup + "</span> dari <span class=\"num\">" + ids.length + "</span> alamat bisa dibuka.";
    ids.sort().forEach(function (id) {
      var e = data.mirrors[id];
      var lab = label(e);
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "dot " + (e.ok ? "dot-green" : "dot-red");
      dot.setAttribute("aria-hidden", "true");
      var info = document.createElement("span");
      info.className = "info";
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = id;
      var state = document.createElement("span");
      state.className = "state" + (lab.bad ? " bad" : "");
      state.textContent = " " + lab.text;
      info.appendChild(name);
      info.appendChild(state);
      var ms = document.createElement("span");
      ms.className = "ms";
      ms.textContent = (typeof e.ms === "number") ? e.ms + " ms" : "";
      li.appendChild(dot);
      li.appendChild(info);
      li.appendChild(ms);
      daftar.appendChild(li);
    });
    if (typeof data.generatedAt === "number") {
      diperbarui.textContent = "Terakhir dicek: " + new Date(data.generatedAt).toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB.";
    }
  }).catch(function () {
    ringkasan.textContent = "";
    var p = document.createElement("p");
    p.className = "error";
    p.textContent = "Status belum bisa dimuat. Coba muat ulang halaman ini.";
    daftar.appendChild(p);
  });
})();
</script>
</body>
</html>
